[project]
name = "isa-agent"
version = "0.1.0"
description = "Documentation-grounded LLM agent that writes and optimises DSP kernels for an unseen vector ISA, verified with LLVM/clang and QEMU; plus an ONNX -> MLIR -> RISC-V comparison path."
authors = [{ name = "Pavan Yadav Annappa", email = "pavanyadava07@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy<2.3", "httpx", "onnx", "onnxruntime", "matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["isaagent"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_site.py" = ["E501"]  # embedded HTML/JS template
